<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Great Lake | Transcript Splitter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091621;color:#e1edf4;font:15px system-ui;line-height:1.5}main{max-width:850px;margin:auto;padding:24px 18px}a{color:#65c4ff}h1{font-size:24px;margin:18px 0}label{display:block;margin:16px 0 6px}textarea,input,button{font:inherit}textarea{width:100%;min-height:180px;resize:vertical;background:#112638;color:#e1edf4;border:1px solid #355569;border-radius:6px;padding:12px}input[type=number]{width:120px;background:#112638;color:#e1edf4;border:1px solid #355569;padding:8px;border-radius:4px}button{background:#1a735e;color:white;border:1px solid #438f7d;border-radius:6px;padding:9px 14px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.part{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #355569;padding:12px 0}.part span{overflow-wrap:anywhere;min-width:0}.part button{flex-shrink:0}#status{color:#94d4b8;overflow-wrap:anywhere}#manifest{margin:12px 0}input[type=file]{max-width:100%}
</style>
<style>
.limit-note{font-size:13px;color:#a7becd;margin:0 0 18px}main.file-drag-over textarea{outline:2px solid #65c4ff;background:#16344a}
.download-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.download-actions #manifest{margin:0}
</style>
<main>
<a href="/">The Great Lake</a>
<h1>Transcript Splitter</h1>
<label for="file">TXT transcript</label><input id="file" type="file" accept=".txt,text/plain">
<label for="text">Transcript</label><textarea id="text" spellcheck="false"></textarea>
<div class="toolbar"><div><label for="size">Characters per part</label><input id="size" type="number" min="1000" max="30000" step="1000" value="29000" aria-describedby="limitNote"></div><button id="split">Split Transcript</button></div>
<p class="limit-note" id="limitNote">The Lake accepts 30,000 characters total per request, including your message and selected text files. The 29,000 default leaves about 1,000 for your question. Select one part at a time; use smaller parts for longer questions.</p>
<div id="status" role="status"></div><div class="download-actions"><button id="zip" hidden>Download All ZIP</button><button id="manifest" title="Optional JSON index of filenames, part order and positions in the original transcript" hidden>Download Part Index</button></div><div id="parts"></div>
</main>
<script src="/transcript-splitter.js"></script>
<script src="/vendor/jszip.min.js"></script>
<script src="/transcript-splitter-ui.js"></script>
</html>

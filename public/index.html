<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Great Lake">
<meta name="theme-color" content="#0a1628">
<meta name="description" content="The Great Lake — Leadership Clarity Engine">
<link rel="manifest" href="/manifest.json">
<title>The Great Lake</title>
<style>
/* ── RESET ── */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ── VARIABLES ── */
:root {
  --lake-deep: #0a1628;
  --lake-mid: #0d1f3c;
  --lake-surface: #132844;
  --lake-shimmer: #1a3a5c;
  --lake-glow: #2d8cf0;
  --lake-light: #64b5f6;
  --lake-foam: #b3e5fc;
  --lake-white: #e1f5fe;
  --dock-bg: #091420;
  --dock-border: #1a3050;
  --sand: #c8a96e;
  --driftwood: #8b7355;
  --calm: #4fc3f7;
  --analytical: #7c4dff;
  --stormy: #ff6e40;
  --text-primary: #e1f5fe;
  --text-secondary: #80b4d8;
  --text-dim: #4a6d8c;
  --danger: #ef5350;
  --success: #66bb6a;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* ── BASE ── */
html, body {
  height: 100%;
  height: -webkit-fill-available;
  overflow: hidden;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--lake-deep);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  overscroll-behavior: none;
}

/* ── WATER BG ── */
.water-bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
}
.water-bg::before {
  content: '';
  position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(45,140,240,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(100,181,246,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(45,140,240,0.05) 0%, transparent 50%);
  animation: waterDrift 20s ease-in-out infinite;
}
@keyframes waterDrift {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  25%       { transform: translate(-20px,10px) rotate(1deg); }
  50%       { transform: translate(10px,-15px) rotate(-0.5deg); }
  75%       { transform: translate(-10px,5px) rotate(0.5deg); }
}
@keyframes gentleFloat {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-10px); }
}
@keyframes lakeLogoPulse {
  0%, 100% { filter: drop-shadow(0 0 8px var(--lake-glow)); }
  50%       { filter: drop-shadow(0 0 18px var(--lake-light)); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}
@keyframes waveIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes rippleAnim {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30%           { opacity: 1;   transform: translateY(-5px); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes slideUpCard {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* ── LOGIN ── */
.login-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--lake-deep);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; padding-top: calc(24px + var(--safe-top));
  overflow-y: auto;
}
.login-screen.hidden { display: none; }
.login-logo { font-size: 72px; margin-bottom: 16px; animation: gentleFloat 4s ease-in-out infinite; }
.login-title { font-size: 32px; font-weight: 700; color: var(--lake-light); margin-bottom: 6px; text-align: center; }
.login-sub   { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 32px; letter-spacing: 0.5px; }
.login-card  { width: 100%; max-width: 380px; background: var(--lake-surface); border: 1px solid var(--dock-border); border-radius: 20px; padding: 28px; }
.login-card h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 20px; text-align: center; }
.profile-pic-upload { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; cursor: pointer; }
.profile-pic-preview {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 8px; overflow: hidden;
  border: 2px solid var(--dock-border); transition: border-color 0.2s; position: relative;
}
.profile-pic-preview:hover { border-color: var(--lake-glow); }
.profile-pic-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.profile-pic-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.4); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; opacity: 0; transition: opacity 0.2s;
}
.profile-pic-preview:hover .profile-pic-overlay { opacity: 1; }
.profile-pic-hint { font-size: 11px; color: var(--text-dim); }
#profilePicInput { display: none; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
.login-field input {
  width: 100%; padding: 14px 16px;
  background: var(--lake-mid); border: 1px solid var(--dock-border); border-radius: 12px;
  color: var(--text-primary); font-size: 16px; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.login-field input:focus { border-color: var(--lake-glow); box-shadow: 0 0 0 3px rgba(45,140,240,0.1); }
.login-field input::placeholder { color: var(--text-dim); }
.login-field input + input { margin-top: 8px; }
.login-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  border: none; border-radius: 14px;
  color: var(--lake-deep); font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 8px; transition: all 0.2s;
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(45,140,240,0.3); }
.login-divider {
  text-align: center; color: var(--text-dim); font-size: 12px;
  margin: 16px 0; position: relative;
}
.login-divider::before, .login-divider::after {
  content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--dock-border);
}
.login-divider::before { left: 0; }
.login-divider::after  { right: 0; }
.login-guest-btn {
  width: 100%; padding: 14px; background: transparent;
  border: 1px solid var(--dock-border); border-radius: 14px;
  color: var(--text-secondary); font-size: 14px; cursor: pointer; transition: all 0.2s;
}
.login-guest-btn:hover { background: var(--lake-mid); color: var(--lake-light); }
.login-install-hint {
  margin-top: 24px; padding: 14px 20px;
  background: rgba(45,140,240,0.08); border: 1px solid rgba(45,140,240,0.15);
  border-radius: 14px; text-align: center; font-size: 12px; color: var(--text-dim);
  max-width: 380px; width: 100%;
}
.login-install-hint strong { color: var(--lake-light); }

/* ── APP LAYOUT ── */
.app-layout {
  display: flex;
  height: 100%;
  height: -webkit-fill-available;
  position: relative; z-index: 1;
}

/* ── DOCK ── */
.dock {
  width: 272px; min-width: 272px;
  background: var(--dock-bg); border-right: 1px solid var(--dock-border);
  display: flex; flex-direction: column; z-index: 200;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.dock-header {
  padding: 16px 18px; padding-top: calc(16px + var(--safe-top));
  border-bottom: 1px solid var(--dock-border);
  display: flex; align-items: center; gap: 10px;
}
.dock-logo     { font-size: 26px; line-height: 1; }
.dock-title    { font-size: 17px; font-weight: 700; color: var(--lake-light); letter-spacing: 0.3px; }
.dock-subtitle { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; }
.new-session-btn {
  margin: 12px 12px 6px; padding: 10px;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  border: none; border-radius: 11px;
  color: var(--lake-deep); font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: all 0.2s;
}
.new-session-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(45,140,240,0.3); }
.dock-section       { padding: 0; }
.dock-section-title { padding: 6px 18px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); }
.sonar-wrap  { padding: 0 12px 6px; position: relative; }
.sonar-icon  { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text-dim); pointer-events: none; }
.sonar-input {
  width: 100%; padding: 9px 12px 9px 34px;
  background: var(--lake-mid); border: 1px solid var(--dock-border); border-radius: 9px;
  color: var(--text-primary); font-size: 12px; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.sonar-input:focus { border-color: var(--lake-glow); }
.past-tides {
  flex: 1; overflow-y: auto; padding: 2px 6px; -webkit-overflow-scrolling: touch;
}
.past-tides::-webkit-scrollbar       { width: 3px; }
.past-tides::-webkit-scrollbar-track { background: transparent; }
.past-tides::-webkit-scrollbar-thumb { background: var(--dock-border); border-radius: 3px; }
.tide-item {
  padding: 8px 10px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: flex-start; gap: 8px;
  transition: background 0.15s; margin-bottom: 1px;
}
.tide-item:hover, .tide-item:active { background: rgba(45,140,240,0.08); }
.tide-item.active { background: rgba(45,140,240,0.12); border: 1px solid rgba(45,140,240,0.2); }
.tide-icon    { font-size: 14px; margin-top: 2px; flex-shrink: 0; }
.tide-info    { overflow: hidden; flex: 1; }
.tide-name    { font-size: 12px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tide-preview { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.tide-time    { font-size: 9px; color: var(--text-dim); flex-shrink: 0; margin-top: 3px; }
.tide-rename  {
  background: none; border: none; cursor: pointer; font-size: 12px; padding: 3px;
  opacity: 0.35; transition: opacity 0.2s; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.tide-rename:hover { opacity: 1; }
.tide-delete {
  width: 22px; height: 22px; border-radius: 5px; border: none;
  background: transparent; color: var(--danger); cursor: pointer; font-size: 11px;
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.tide-item:hover .tide-delete { display: flex; }
.crew-list {
  padding: 2px 6px; max-height: 160px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.crew-item {
  padding: 7px 10px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  transition: background 0.15s; margin-bottom: 1px;
}
.crew-item:hover, .crew-item:active { background: rgba(45,140,240,0.08); }
.crew-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden;
}
.crew-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.crew-name     { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.crew-nickname { font-size: 10px; color: var(--text-dim); }
.dock-footer {
  padding: 10px 14px; padding-bottom: calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--dock-border);
  display: flex; align-items: center; gap: 10px;
}
.dock-footer-btn {
  width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid var(--dock-border); background: transparent;
  color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.15s;
}
.dock-footer-btn:hover { background: var(--lake-mid); color: var(--lake-light); }
.dock-user-area {
  flex: 1; display: flex; align-items: center; gap: 9px;
  overflow: hidden; cursor: pointer;
}
.dock-user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sand), var(--driftwood));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; overflow: hidden;
  border: 2px solid var(--dock-border); transition: border-color 0.2s;
}
.dock-user-avatar:hover { border-color: var(--lake-glow); }
.dock-user-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.dock-user-name   { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.dock-user-status { font-size: 9px; color: var(--success); }
.dock-toggle {
  display: none; position: fixed;
  top: calc(14px + var(--safe-top)); left: 14px; z-index: 300;
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(9,20,32,0.95); border: 1px solid var(--dock-border);
  color: var(--text-primary); font-size: 18px; cursor: pointer;
  align-items: center; justify-content: center;
  backdrop-filter: blur(10px); box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.dock-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; pointer-events: none; }
.dock-overlay.show { display: block; pointer-events: auto; left: 80vw; width: 20vw; }

/* ── MAIN WINDOW ── */
.lake-window {
  flex: 1; display: flex; flex-direction: column;
  position: relative; z-index: 5; min-width: 0;
  height: 100%; overflow: hidden;
}
.lake-header {
  padding: 11px 16px; padding-top: calc(11px + var(--safe-top));
  border-bottom: 1px solid var(--dock-border);
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(9,20,32,0.9); flex-shrink: 0; position: relative;
}
.lake-header-left  { display: flex; align-items: center; gap: 9px; }
.lake-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.lake-header-info h2     { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.lake-header-status      { font-size: 10px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.status-dot              { width: 5px; height: 5px; border-radius: 50%; background: var(--success); display: inline-block; animation: pulse 2s ease-in-out infinite; }
.lake-header-right       { display: flex; gap: 5px; }
.header-btn {
  width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid var(--dock-border); background: transparent;
  color: var(--text-secondary); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.header-btn:hover, .header-btn:active { background: var(--lake-mid); color: var(--lake-light); }

/* ── SHARE MENU ── */
.share-menu {
  display: none; position: absolute; top: 60px; right: 12px;
  background: var(--lake-surface); border: 1px solid var(--dock-border);
  border-radius: 12px; padding: 8px; z-index: 100; min-width: 180px;
}
.share-menu div { padding: 8px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; color: var(--text-secondary); }
.share-menu div:hover { background: rgba(45,140,240,0.1); color: var(--lake-light); }

/* ── MOOD SELECTOR ── */
.mood-selector {
  display: none; position: absolute; top: calc(100% + 8px); right: 16px;
  background: var(--dock-bg); border: 1px solid var(--dock-border);
  border-radius: 14px; padding: 8px; z-index: 50;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); min-width: 220px;
}
.mood-selector.show { display: block; }
.mood-option {
  padding: 9px 13px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  font-size: 13px; color: var(--text-secondary); transition: background 0.15s;
}
.mood-option:hover  { background: rgba(45,140,240,0.1); }
.mood-option.active { background: rgba(45,140,240,0.15); color: var(--lake-light); }
.mood-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── CURRENTS BAR ── */
.currents-bar {
  padding: 6px 14px; border-bottom: 1px solid rgba(26,48,80,0.4);
  display: flex; align-items: center; gap: 6px; overflow-x: auto;
  background: rgba(13,31,60,0.3); flex-shrink: 0; -webkit-overflow-scrolling: touch;
}
.currents-bar::-webkit-scrollbar { height: 0; }
.currents-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); flex-shrink: 0; font-weight: 600; }
.current-chip {
  padding: 3px 9px; background: rgba(45,140,240,0.08);
  border: 1px solid rgba(45,140,240,0.15); border-radius: 20px;
  font-size: 10px; color: var(--lake-light); white-space: nowrap;
  cursor: pointer; transition: all 0.15s; flex-shrink: 0;
}
.current-chip:hover { background: rgba(45,140,240,0.18); border-color: rgba(45,140,240,0.35); }
.current-chip.persona-chip {
  background: linear-gradient(135deg, rgba(45,140,240,0.15), rgba(100,181,246,0.1));
  border-color: rgba(45,140,240,0.3); font-weight: 600;
}

/* ── WAVES CONTAINER ── */
.waves-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 12px 14px;
  gap: 10px;
}
.waves-container::-webkit-scrollbar       { width: 0; }
.waves-container::-webkit-scrollbar-track { background: transparent; }
.waves-container::-webkit-scrollbar-thumb { background: var(--lake-shimmer); border-radius: 4px; }

/* ── WELCOME SCREEN ── */
.welcome-screen {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 8px 4px;
  min-height: 0;
}
.welcome-icon {
  font-size: 52px; margin-bottom: 12px;
  animation: gentleFloat 4s ease-in-out infinite, lakeLogoPulse 3s ease-in-out infinite;
  cursor: pointer; display: inline-block; transition: transform 0.2s ease;
}
.welcome-icon:hover { transform: scale(1.12); }
.welcome-title { font-size: 22px; font-weight: 700; color: var(--lake-light); margin-bottom: 7px; }
.welcome-sub   { font-size: 13px; color: var(--text-dim); max-width: 320px; line-height: 1.6; margin-bottom: 20px; }
.welcome-prompts {
  display: flex; flex-direction: column; gap: 6px;
  width: 100%; max-width: 520px;
  padding: 0 8px; box-sizing: border-box;
}
.welcome-prompt-featured {
  background: linear-gradient(135deg, rgba(79,195,247,0.15), rgba(79,195,247,0.05));
  border: 1px solid rgba(79,195,247,0.3);
  color: var(--sand); padding: 11px 16px; border-radius: 13px;
  font-size: 13px; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 8px;
  width: 100%; transition: all 0.2s ease;
}
.welcome-prompt-featured:hover {
  background: linear-gradient(135deg, rgba(79,195,247,0.25), rgba(79,195,247,0.1));
  border-color: rgba(79,195,247,0.5); transform: translateY(-1px);
}

/* ── CAROUSEL ── */
.prompt-carousel-container {
  width: 100%; overflow: hidden; position: relative; box-sizing: border-box;
}
.prompt-carousel-track {
  display: flex; flex-direction: row;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform; width: 100%;
}
.prompt-batch {
  min-width: 100%; width: 100%; flex-shrink: 0;
  box-sizing: border-box; display: flex; flex-direction: column; gap: 4px;
}
.batch-label {
  text-align: center; font-size: 0.7rem; letter-spacing: 0.08em;
  color: var(--lake-light); opacity: 0.5;
  margin-top: 4px; margin-bottom: 4px; text-transform: uppercase;
}
.welcome-prompts-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
  width: 100%; box-sizing: border-box;
}
.welcome-prompt-half {
  background: rgba(45,140,240,0.07); border: 1px solid rgba(45,140,240,0.13);
  border-radius: 13px; color: var(--text-secondary); font-size: 12px;
  cursor: pointer; text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  height: 38px; display: flex; align-items: center; justify-content: center;
  padding: 0 10px; transition: all 0.2s ease;
  user-select: none; -webkit-user-select: none;
}
.welcome-prompt-half:hover  { background: rgba(45,140,240,0.15); color: var(--lake-light); }
.welcome-prompt-half:active { transform: scale(0.97); }
.welcome-prompt-half.long-pressing { background: rgba(100,180,255,0.15); border-color: rgba(100,180,255,0.4); }
.carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; margin-bottom: 2px; }
.carousel-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.2); cursor: pointer;
  transition: background 0.25s ease, transform 0.25s ease;
}
.carousel-dot.active { background: var(--lake-light); transform: scale(1.3); }

/* ── WAVE BUBBLES ── */
.wave {
  display: flex; gap: 9px; max-width: 84%;
  animation: waveIn 0.35s ease-out; flex-shrink: 0;
}
.wave.user-wave { align-self: flex-end; flex-direction: row-reverse; }
.wave.lake-wave { align-self: flex-start; }
.wave-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; margin-top: 4px; overflow: hidden;
}
.wave-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.wave.lake-wave .wave-avatar { background: linear-gradient(135deg, var(--lake-glow), var(--lake-light)); }
.wave.user-wave .wave-avatar { background: linear-gradient(135deg, var(--sand), var(--driftwood)); }
.wave-content { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wave-sender { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.lake-wave .wave-sender { color: var(--lake-light); }
.user-wave .wave-sender { color: var(--sand); text-align: right; }
.wave-bubble {
  padding: 11px 15px; border-radius: 17px;
  font-size: 14px; line-height: 1.6;
  word-wrap: break-word; word-break: break-word;
}
.lake-wave .wave-bubble {
  background: var(--lake-surface); border: 1px solid var(--dock-border);
  border-top-left-radius: 4px; color: var(--text-primary);
}
.user-wave .wave-bubble {
  background: linear-gradient(135deg, rgba(45,140,240,0.2), rgba(45,140,240,0.1));
  border: 1px solid rgba(45,140,240,0.2);
  border-top-right-radius: 4px; color: var(--text-primary);
}
.wave-time { font-size: 9px; color: var(--text-dim); }
.user-wave .wave-time { text-align: right; }

/* ── BUBBLE ACTIONS ── */
.bubble-actions { display: none; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.bubble-actions.show { display: flex; }
.bubble-action-btn {
  padding: 4px 9px; background: rgba(45,140,240,0.08);
  border: 1px solid rgba(45,140,240,0.15); border-radius: 20px;
  color: var(--text-secondary); font-size: 11px; cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; gap: 4px;
}
.bubble-action-btn:hover { background: rgba(45,140,240,0.18); color: var(--lake-light); }
.speaking .wave-bubble { border-color: var(--lake-glow); box-shadow: 0 0 12px rgba(45,140,240,0.2); }

/* ── ATTACHMENTS ── */
.wave-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.wave-attachment {
  display: flex; align-items: center; gap: 6px; padding: 5px 9px;
  background: rgba(45,140,240,0.1); border: 1px solid rgba(45,140,240,0.2);
  border-radius: 7px; cursor: pointer; transition: all 0.15s; max-width: 200px;
}
.wave-attachment:hover { background: rgba(45,140,240,0.2); }
.wave-attachment-thumb  { width: 44px; height: 44px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
.wave-attachment-icon   { font-size: 18px; flex-shrink: 0; }
.wave-attachment-name   { font-size: 10px; color: var(--lake-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attachment-lightbox {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 1000; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
.attachment-lightbox.show { display: flex; }
.attachment-lightbox img  { max-width: 90vw; max-height: 80vh; border-radius: 12px; object-fit: contain; }
.attachment-lightbox-name { color: var(--text-secondary); font-size: 12px; }
.attachment-lightbox-close {
  position: absolute; top: 20px; right: 20px;
  width: 38px; height: 38px; border-radius: 11px;
  border: 1px solid var(--dock-border); background: var(--dock-bg);
  color: var(--text-primary); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── RIPPLE ── */
.ripple {
  display: none; align-self: flex-start;
  padding: 12px 16px; background: var(--lake-surface);
  border: 1px solid var(--dock-border); border-radius: 17px;
  border-top-left-radius: 4px; flex-shrink: 0;
}
.ripple.show { display: flex; gap: 5px; align-items: center; }
.ripple-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--lake-light); opacity: 0.3;
  animation: rippleAnim 1.4s ease-in-out infinite;
}
.ripple-dot:nth-child(2) { animation-delay: 0.2s; }
.ripple-dot:nth-child(3) { animation-delay: 0.4s; }

/* ── SHORE DOCK ── */
.shore-dock {
  flex-shrink: 0;
  width: 100%;
  background: var(--dock-bg);
  border-top: 1px solid var(--dock-border);
  padding: 8px 10px;
  padding-bottom: calc(8px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 5px;
  box-sizing: border-box;
}

/* ── PROMPT SUGGESTIONS ── */
.suggestions-top-row {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px;
}
.suggestions-top-row::-webkit-scrollbar { height: 0; }
.suggestions-toggle {
  background: rgba(45,140,240,0.05); border: 1px solid rgba(45,140,240,0.12);
  color: var(--text-dim); border-radius: 20px; padding: 4px 10px;
  font-size: 10px; cursor: pointer; transition: all 0.15s;
  white-space: nowrap; flex-shrink: 0;
}
.suggestions-toggle:hover { color: var(--lake-light); border-color: rgba(45,140,240,0.28); }
.suggestions-list {
  display: none; flex-wrap: wrap; gap: 5px;
  padding: 4px 0; max-height: 130px; overflow-y: auto;
}
.suggestions-list.open { display: flex; }

/* ── QUICK ACTIONS ── */
.quick-actions {
  display: flex; gap: 5px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; padding-bottom: 1px;
}
.quick-actions::-webkit-scrollbar { height: 0; }
.quick-action-btn {
  padding: 4px 9px;
  background: rgba(45,140,240,0.05); border: 1px solid rgba(45,140,240,0.1);
  border-radius: 20px; color: var(--text-dim); font-size: 10px;
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
  display: flex; align-items: center; gap: 3px; flex-shrink: 0;
}
.quick-action-btn:hover, .quick-action-btn:active {
  background: rgba(45,140,240,0.12); color: var(--lake-light); border-color: rgba(45,140,240,0.25);
}

/* ── FILE PREVIEWS ── */
.files-preview-container { display: none; flex-wrap: wrap; gap: 7px; padding: 4px 0; }
.files-preview-container.show { display: flex; }
.file-preview-chip {
  display: flex; align-items: center; gap: 7px; padding: 5px 9px;
  background: rgba(45,140,240,0.08); border: 1px solid rgba(45,140,240,0.14);
  border-radius: 9px; max-width: 190px;
}
.file-preview-chip-thumb  { width: 28px; height: 28px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
.file-preview-chip-icon   { font-size: 18px; flex-shrink: 0; }
.file-preview-chip-info   { flex: 1; min-width: 0; }
.file-preview-chip-name   { font-size: 10px; font-weight: 500; color: var(--lake-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-preview-chip-size   { font-size: 9px; color: var(--text-dim); }
.file-preview-chip-remove {
  width: 18px; height: 18px; border-radius: 4px; border: none;
  background: rgba(239,83,80,0.1); color: var(--danger);
  cursor: pointer; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* ── INPUT ROW ── */
.input-row {
  display: flex;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  box-sizing: border-box;
  /* Height driven by textarea min-height */
}

.input-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
}

.lake-input {
  width: 100%;
  min-height: 80px;
  max-height: 140px;
  padding: 10px 14px;
  background: var(--lake-mid);
  border: 1px solid var(--dock-border);
  border-radius: 12px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  resize: none;
  line-height: 1.5;
  box-sizing: border-box;
  display: block;
  outline: none;
}
.lake-input:focus        { border-color: var(--lake-glow); box-shadow: 0 0 0 3px rgba(45,140,240,0.1); }
.lake-input::placeholder { color: var(--text-dim); }

/* ── SIDE BUTTONS (attach + mic stacked) ── */
.side-buttons {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex-shrink: 0;
  /* Match height of textarea */
  min-height: 80px;
}
.attach-btn-stack,
.mic-btn {
  flex: 1;
  width: 50px;
  border-radius: 12px;
  border: 1px solid var(--dock-border);
  background: var(--lake-mid);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 18px;
}
.attach-btn-stack:hover { color: var(--lake-light); background: rgba(45,140,240,0.1); }
.mic-btn              { color: var(--text-secondary); font-size: 20px; }
.mic-btn:hover        { color: var(--lake-light); background: rgba(45,140,240,0.1); }
.mic-btn.listening    { background: rgba(239,83,80,0.15); border-color: rgba(239,83,80,0.4); color: var(--danger); }

/* ── SEND BUTTON ── */
.send-btn {
  width: 58px;
  flex-shrink: 0;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  color: var(--lake-deep);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  /* Same height as side-buttons stack */
  align-self: stretch;
}
.send-btn:hover  { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(45,140,240,0.35); }
.send-btn:active { transform: scale(0.93); }

/* ── ATTACH MENU ── */
.attach-menu {
  display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
  background: var(--dock-bg); border: 1px solid var(--dock-border);
  border-radius: 13px; padding: 7px; z-index: 50;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); min-width: 170px;
}
.attach-menu.show { display: block; }
.attach-menu-item {
  padding: 9px 13px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
  font-size: 13px; color: var(--text-secondary); transition: background 0.15s;
}
.attach-menu-item:hover { background: rgba(45,140,240,0.1); color: var(--lake-light); }

/* ── INPUT HINT ── */
.input-hint { text-align: center; padding-top: 2px; font-size: 10px; color: var(--text-dim); opacity: 0.6; }

/* ── HIDDEN FILE INPUTS ── */
#fileInput, #cameraInput, #imageInput { display: none; }

/* ── INSTALL BANNER ── */
.install-banner {
  display: none; position: fixed;
  bottom: calc(20px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%);
  background: var(--lake-surface); border: 1px solid var(--lake-glow);
  border-radius: 16px; padding: 14px 20px; z-index: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  width: calc(100% - 32px); max-width: 380px;
  align-items: center; gap: 12px; animation: slideUp 0.4s ease-out;
}
 .install-banner.show { display: flex; }
.install-banner-text { flex: 1; font-size: 13px; color: var(--text-primary); }
.install-banner-text strong { color: var(--lake-light); }
.install-banner-text small { display: block; color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.install-banner-btn {
  padding: 8px 16px;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  border: none; border-radius: 10px;
  color: var(--lake-deep); font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.install-banner-close {
  width: 28px; height: 28px; border-radius: 8px; border: none;
  background: transparent; color: var(--text-dim); cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--lake-surface); border: 1px solid var(--lake-glow);
  border-radius: 20px; padding: 8px 18px;
  font-size: 12px; color: var(--lake-light);
  opacity: 0; transition: all 0.3s; z-index: 9999;
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── DEPTHS PANEL ── */
.depths-panel {
  display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
  background: var(--dock-bg); border-left: 1px solid var(--dock-border);
  z-index: 400; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,0.4);
}
.depths-panel.show { display: flex; }
.depths-header {
  padding: 18px; padding-top: calc(18px + var(--safe-top));
  border-bottom: 1px solid var(--dock-border);
  display: flex; align-items: center; justify-content: space-between;
}
.depths-header h3 { font-size: 15px; color: var(--lake-light); }
.depths-close {
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid var(--dock-border); background: transparent;
  color: var(--text-secondary); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.depths-content { flex: 1; overflow-y: auto; padding: 18px; -webkit-overflow-scrolling: touch; }
.depths-section { margin-bottom: 20px; }
.depths-section h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px; }
.depths-profile {
  display: flex; flex-direction: column; align-items: center;
  padding: 14px; background: var(--lake-surface); border-radius: 13px;
  margin-bottom: 14px; cursor: pointer; transition: background 0.15s;
}
.depths-profile:hover { background: var(--lake-shimmer); }
.depths-profile-pic {
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sand), var(--driftwood));
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; overflow: hidden; border: 2px solid var(--dock-border); margin-bottom: 7px;
}
.depths-profile-pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.depths-profile-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.depths-profile-hint { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.depths-option {
  padding: 9px 13px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 9px; margin-bottom: 3px;
  transition: background 0.15s; font-size: 13px; color: var(--text-secondary);
}
.depths-option:hover  { background: rgba(45,140,240,0.08); }
.depths-option.active { background: rgba(45,140,240,0.12); color: var(--lake-light); }
.depths-info   { padding: 7px 11px; font-size: 12px; color: var(--text-dim); cursor: default; }
.logout-btn {
  width: 100%; padding: 11px;
  background: rgba(239,83,80,0.1); border: 1px solid rgba(239,83,80,0.2);
  border-radius: 11px; color: var(--danger); font-size: 13px; font-weight: 500;
  cursor: pointer; margin-top: 6px; transition: all 0.2s;
}
.logout-btn:hover { background: rgba(239,83,80,0.2); }

/* ── SUGGESTED CREW ── */
.suggested-crew-section { padding: 3px 6px 0; }
.suggested-title {
  padding: 6px 10px 3px; font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px; color: var(--sand);
  display: flex; align-items: center; gap: 5px;
}
.suggested-item {
  padding: 7px 10px; border-radius: 9px; display: flex; align-items: center; gap: 7px;
  margin-bottom: 2px; background: rgba(200,169,110,0.06); border: 1px solid rgba(200,169,110,0.12);
}
.suggested-name    { flex: 1; font-size: 12px; color: var(--text-secondary); font-style: italic; }
.suggested-approve {
  width: 24px; height: 24px; border-radius: 7px; border: none;
  background: rgba(102,187,106,0.15); color: var(--success);
  cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.suggested-approve:hover { background: rgba(102,187,106,0.3); }
.suggested-dismiss {
  width: 24px; height: 24px; border-radius: 7px; border: none;
  background: rgba(239,83,80,0.1); color: var(--danger);
  cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.suggested-dismiss:hover { background: rgba(239,83,80,0.25); }

/* ── CREW MODAL ── */
.crew-modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 600; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); padding: 20px;
}
.crew-modal-overlay.show { display: flex; }
.crew-modal {
  background: var(--dock-bg); border: 1px solid var(--dock-border);
  border-radius: 20px; padding: 24px; width: 100%; max-width: 360px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6); animation: waveIn 0.3s ease-out;
}
.crew-modal h3 { font-size: 16px; color: var(--lake-light); margin-bottom: 20px; text-align: center; }
.crew-modal-field { margin-bottom: 13px; }
.crew-modal-field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 5px; }
.crew-modal-field input,
.crew-modal-field textarea {
  width: 100%; padding: 11px 13px;
  background: var(--lake-mid); border: 1px solid var(--dock-border); border-radius: 9px;
  color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.crew-modal-field input:focus,
.crew-modal-field textarea:focus { border-color: var(--lake-glow); }
.crew-modal-field textarea { resize: none; height: 66px; line-height: 1.5; }
.crew-modal-actions { display: flex; gap: 9px; margin-top: 18px; }
.crew-modal-save {
  flex: 1; padding: 11px;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  border: none; border-radius: 11px;
  color: var(--lake-deep); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.crew-modal-save:hover { transform: translateY(-1px); }
.crew-modal-cancel {
  padding: 11px 16px; background: transparent;
  border: 1px solid var(--dock-border); border-radius: 11px;
  color: var(--text-secondary); font-size: 14px; cursor: pointer;
}
.crew-modal-cancel:hover { background: var(--lake-mid); }
.crew-modal-delete {
  padding: 11px; background: rgba(239,83,80,0.1);
  border: 1px solid rgba(239,83,80,0.2); border-radius: 11px;
  color: var(--danger); font-size: 14px; cursor: pointer;
}
.crew-modal-delete:hover { background: rgba(239,83,80,0.2); }

/* ── CREW CARD ── */
.crew-card-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 600; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px); padding: 20px;
}
.crew-card-overlay.show { display: flex; }
.crew-card {
  background: var(--dock-bg); border: 1px solid var(--dock-border);
  border-radius: 24px 24px 16px 16px; padding: 26px 22px 30px;
  width: 100%; max-width: 420px;
  box-shadow: 0 -8px 48px rgba(0,0,0,0.5); animation: slideUpCard 0.3s ease-out;
}
.crew-card-header  { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
.crew-card-avatar  { width: 54px; height: 54px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: white; flex-shrink: 0; }
.crew-card-info    { flex: 1; min-width: 0; }
.crew-card-name    { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
.crew-card-nickname { font-size: 12px; color: var(--text-secondary); }
.crew-card-codename {
  display: inline-block; margin-top: 5px; padding: 3px 9px;
  background: rgba(79,195,247,0.1); border: 1px solid rgba(79,195,247,0.2);
  border-radius: 20px; font-size: 11px; color: var(--lake-light); font-style: italic;
}
.crew-card-context {
  padding: 12px 14px; background: rgba(255,255,255,0.03);
  border: 1px solid var(--dock-border); border-radius: 11px;
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  margin-bottom: 18px; font-style: italic;
}
.crew-card-context.empty { color: var(--text-dim); }
.crew-card-actions { display: flex; gap: 9px; }
.crew-card-ask {
  flex: 1; padding: 12px;
  background: linear-gradient(135deg, var(--lake-glow), var(--lake-light));
  border: none; border-radius: 11px;
  color: var(--lake-deep); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.crew-card-ask:hover { transform: translateY(-1px); }
.crew-card-edit,
.crew-card-close {

/* ── HELP MODAL ── */
.help-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  z-index: 700; align-items: flex-start; justify-content: center;
  backdrop-filter: blur(4px); padding: 20px; overflow-y: auto;
}
.help-overlay.show { display: flex; }
.help-modal {
  background: var(--dock-bg); border: 1px solid var(--dock-border);
  border-radius: 24px; padding: 26px 22px 30px;
  width: 100%; max-width: 500px; margin: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6); animation: waveIn 0.3s ease-out;
}
.help-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.help-title  { font-size: 19px; font-weight: 800; color: var(--lake-light); }
.help-close  {
  width: 30px; height: 30px; border-radius: 9px; border: none;
  background: var(--lake-mid); color: var(--text-secondary);
  cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center;
}
.help-close:hover { background: var(--dock-border); }
.help-section       { margin-bottom: 20px; }
.help-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--sand); margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
.help-item   { display: flex; gap: 9px; margin-bottom: 7px; align-items: flex-start; }
.help-icon   { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.help-text   { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.help-text strong { color: var(--text-primary); }
.help-divider { height: 1px; background: var(--dock-border); margin: 16px 0; }
.help-tip { padding: 11px 13px; background: rgba(79,195,247,0.06); border: 1px solid rgba(79,195,247,0.15); border-radius: 11px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.help-list { list-style: none; padding: 0; margin: 12px 0 0 0; display: flex; flex-direction: column; gap: 10px; }
.help-list li { padding: 8px 10px; background: rgba(255,255,255,0.04); border-radius: 8px; font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
.help-list li strong { color: var(--text-primary); }

/* ── REFLECTION FORMATTING ── */

.reflection-bullet::before { content: '▸'; position: absolute; left: 0; color: #4fc3f7; }

<div class="water-bg"></div>

<!-- Governance Panel with runtime model display -->
<div class="depths-section">
  <h4>📏 Governance</h4>
  <div class="depths-info">🛡 Rules 1-27: Active</div>
  <div class="depths-info">🔒 Safety Filters: On</div>
  <div class="depths-info">🤖 Model: <span id="runtimeModel">Loading…</span></div>
</div>

<!-- Runtime Model Script for OpenAI API -->
<script>
// Fetch runtime model from the server and display it in the depths panel
async function showRuntimeModel() {
  try {
    const res = await fetch('/health');
    if (!res.ok) return;
    const data = await res.json();
    const modelEl = document.getElementById('runtimeModel');
    
    if (modelEl) {
      // Default to GPT-4 for OpenAI API, or use server-provided model
      const model = data.model || process.env.OPENAI_MODEL || 'gpt-4-turbo';
      modelEl.textContent = model;
    }
  } catch (err) {
    // silently fail — keep "Loading..." if no response
    const modelEl = document.getElementById('runtimeModel');
    if (modelEl) modelEl.textContent = 'gpt-4-turbo';
  }
}

document.addEventListener('DOMContentLoaded', showRuntimeModel);
</script>

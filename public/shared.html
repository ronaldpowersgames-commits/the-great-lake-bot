<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Shared Conversation | The Great Lake</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #091622; color: #e5eef6; font: 15px/1.5 system-ui, sans-serif; }
    header { border-bottom: 1px solid #294154; padding: 16px 20px; }
    header div, main { max-width: 850px; margin: auto; }
    header strong { color: #63bafa; font-size: 20px; }
    header span { display: block; color: #a3b5c4; font-size: 12px; }
    main { padding: 20px 16px 40px; }
    h1 { font-size: 20px; overflow-wrap: anywhere; margin: 0 0 20px; }
    article { max-width: 92%; margin: 14px 0; }
    article.user { margin-left: auto; }
    .sender { font-size: 12px; color: #a3b5c4; margin-bottom: 4px; }
    .user .sender { text-align: right; }
    .bubble { padding: 10px 14px; border: 1px solid #294154; border-radius: 8px; background: #142a40; overflow-wrap: anywhere; }
    .user .bubble {
      background: color-mix(in srgb, #272334 83%, var(--sent-mood, #a393bc));
      border: 1px solid color-mix(in srgb, #42384e 65%, var(--sent-mood, #a393bc));
      border-inline-end: 3px solid var(--sent-mood, #a393bc);
      border-top-right-radius: 4px;
    }
    .user[data-sent-mood="drip"] { --sent-mood:#facc15; }
    .user[data-sent-mood="shallow"] { --sent-mood:#35c98a; }
    .user[data-sent-mood="calm"] { --sent-mood:#4fc3f7; }
    .user[data-sent-mood="analytical"] { --sent-mood:#9b7aff; }
    .user[data-sent-mood="stormy"] { --sent-mood:#ff805c; }
    .bubble p { margin: 0 0 8px; white-space: pre-wrap; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble img { display: block; max-width: 100%; max-height: 600px; height: auto; margin-top: 8px; }
    .attachment, time { color: #a3b5c4; font-size: 12px; }
    time { display: block; margin-top: 3px; }
    a { color: #7fc7fa; }
    .ride-wave-footer { margin-top:28px; padding-top:20px; border-top:1px solid #294154; text-align:right; }
    .ride-wave-footer a { display:inline-block; padding:11px 18px; border-radius:10px; background:#1975ad; border:1px solid #4aaeea; color:white; font-weight:750; text-decoration:none; }
    .ride-wave-footer a:hover { background:#205e92; }
    #unlockDialog { width:min(420px,calc(100% - 32px)); padding:22px; border:1px solid #35546e; border-radius:16px; background:#102337; color:#e5eef6; }
    #unlockDialog::backdrop { background:rgba(5,13,24,.75); }
    #unlockDialog h2 { margin:0 0 12px; color:#7fc7fa; font-size:20px; }
    #unlockPrompt { margin:0 0 14px; overflow-wrap:anywhere; white-space:pre-wrap; }
    #unlockDialog label { display:grid; gap:6px; }
    #unlockDialog input, #unlockDialog button { min-height:42px; padding:8px 12px; border:1px solid #35546e; border-radius:8px; font:inherit; color:inherit; background:#142e49; }
    #unlockDialog button { cursor:pointer; }
    #unlockDialog button[type="submit"] { background:#176096; }
    #unlockError { display:block; color:#ffd1bb; margin:8px 0; }
  </style>
</head>
<body>
  <header><div><strong>The Great Lake</strong><span>Shared conversation · Read only</span></div></header>
  <main>
    <h1 id="title">Loading conversation...</h1>
    <div id="messages" aria-live="polite"></div>
    <footer id="rideWaveFooter" class="ride-wave-footer" hidden><a href="/">🌊 Ride the Wave</a></footer>
  </main>
  <dialog id="unlockDialog" aria-labelledby="unlockTitle" aria-describedby="unlockPrompt">
    <form id="unlockForm">
      <h2 id="unlockTitle">Unlock this Lake share</h2>
      <p id="unlockPrompt">Enter the passphrase from the sender.</p>
      <label>Passphrase <input id="unlockPassphrase" type="password" maxlength="200" required autocomplete="off" autofocus></label>
      <span id="unlockError" role="status"></span>
      <button type="submit">Unlock</button>
      <button type="button" id="cancelUnlock">Cancel</button>
    </form>
  </dialog>
  <script src="/shared-view.js?v=2"></script>
</body>
</html>

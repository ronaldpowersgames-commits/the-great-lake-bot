<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Great Lake - Session Transcript</title>
  <style>
    :root{color-scheme:dark;--deep:#0a1628;--surface:#0d1f3c;--line:#1e3a5f;--text:#c8dff0;--dim:#80a4c2;--glow:#5bc4f5;--user:#4a9eff}
    *{box-sizing:border-box}
    html{background:var(--deep)}
    body{margin:0;background:var(--deep);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.55}
    main{width:min(980px,100%);margin:0 auto;padding:34px 28px 64px}
    .tools{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;gap:8px;padding:10px 0;background:linear-gradient(var(--deep) 72%,transparent)}
    button{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);padding:8px 14px;cursor:pointer;font:inherit}
    button:hover{border-color:var(--glow);color:#fff}
    h1{margin:0;color:var(--glow);font-size:26px;border-bottom:2px solid var(--line);padding-bottom:10px}
    .meta{color:var(--dim);font-size:12px;margin:8px 0 28px}
    .msg{margin:0 0 18px;break-inside:avoid-page}
    .sender{font-weight:750;font-size:12px;margin-bottom:5px;color:var(--glow)}
    .sender.user{color:var(--user)}
    .text{margin:0;background:var(--surface);border:1px solid rgba(30,58,95,.65);padding:12px 16px;border-radius:10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .empty{padding:40px;text-align:center;color:var(--dim)}
    @media(max-width:600px){main{padding:18px 14px 42px}.text{font-size:13px;padding:10px 12px}h1{font-size:21px}}
    @media print{
      :root{color-scheme:light}
      html,body{background:#fff;color:#172033}
      main{width:auto;margin:0;padding:0}
      .tools{display:none}
      h1{color:#075985;border-color:#bae6fd}
      .meta{color:#526477}
      .sender{color:#075985}.sender.user{color:#1d4ed8}
      .text{background:#f5f9ff;border-color:#dbeafe;color:#172033}
    }
  </style>
</head>
<body>
  <main>
    <div class="tools"><button type="button" onclick="window.print()">Print / Save PDF</button><button type="button" onclick="window.close()">Close</button></div>
    <h1>🌊 The Great Lake - Session Transcript</h1>
    <div class="meta" id="meta"></div>
    <section id="messages"></section>
  </main>
  <script src="/export-names.js"></script>
  <script>
    (()=>{
      const id=new URLSearchParams(location.search).get('id');
      let data=null;
      try{data=JSON.parse(localStorage.getItem(id)||'null');}catch{}
      const meta=document.getElementById('meta');const messages=document.getElementById('messages');
      if(!data || !Array.isArray(data.messages)){
        meta.textContent='Transcript data is unavailable or has expired.';
        const empty=document.createElement('div');empty.className='empty';empty.textContent='Return to The Lake and export the transcript again.';messages.append(empty);return;
      }
      document.title=LakeExportNames.sessionTranscript('pdf',data.created || data.exported,data.title).replace(/\.pdf$/,'');
      meta.textContent='Exported: '+data.exported+' · Screenshot-friendly page';
      data.messages.forEach(message=>{
        const article=document.createElement('article');article.className='msg';
        const sender=document.createElement('div');sender.className='sender '+(message.role==='user'?'user':'lake');
        sender.textContent=(message.role==='user'?'👤 You':'🌊 The Lake')+(message.time?' · '+message.time:'');
        const text=document.createElement('div');text.className='text';text.textContent=message.text;
        article.append(sender,text);messages.append(article);
      });
    })();
  </script>
</body>
</html>
